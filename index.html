  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

00: #b5d9fd;\n  --color-accent-400: #94bce3;\n  --color-accent-500: #749dc4;\n  --color-accent-600: #597ea3;\n  --color-accent-700: #416180;\n  --color-accent-800: #2c455d;\n  --color-accent-900: #1d2d3d;\n\n  --color-accent-2-100: #eef6ff;\n  --color-accent-2-200: #d6ebff;\n  --color-accent-2-300: #bdd8f2;\n  --color-accent-2-400: #9ebbd8;\n  --color-accent-2-500: #7e9cb8;\n  --color-accent-2-600: #627d98;\n  --color-accent-2-700: #486077;\n  --color-accent-2-800: #314457;\n  --color-accent-2-900: #1f2d3a;\n\n  --font-heading: \"Barlow Condensed\", system-ui, sans-serif;\n  --font-heading-weight: 600;\n  --font-body: \"Barlow\", system-ui, sans-serif;\n\n  --space-1: 3.4px;\n  --space-2: 6.8px;\n  --space-3: 10.2px;\n  --space-4: 13.6px;\n  --space-6: 20.4px;\n  --space-8: 27.2px;\n\n  --radius-sm: 2px;\n  --radius-md: 4px;\n  --radius-lg: 7px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2b2b2d 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2b2b2d 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2b2b2d 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.blueprint {\n  position: relative;\n  border: 1px solid var(--color-divider);\n  border-radius: 0;\n}\n/* The overlay image treatments (halftone, duotone) clip their overlay\n   (overflow:hidden); a blueprint wrapper draws its registration marks\n   outside the box, so when both classes share a wrapper the frame must\n   win. */\n.blueprint.halftone, .blueprint.plate, .blueprint.duotone { overflow: visible; }\n.blueprint > .corner {\n  position: absolute; width: 11px; height: 11px;\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.blueprint > .corner::before, .blueprint > .corner::after {\n  content: \"\"; position: absolute; background: currentColor;\n}\n.blueprint > .corner::before { left: 5px; top: 0; width: 1px; height: 100%; }\n.blueprint > .corner::after  { top: 5px; left: 0; width: 100%; height: 1px; }\n.blueprint > .corner.tl { top: -6px; left: -6px; }\n.blueprint > .corner.tr { top: -6px; right: -6px; }\n.blueprint > .corner.bl { bottom: -6px; left: -6px; }\n.blueprint > .corner.br { bottom: -6px; right: -6px; }\n\n.duotone{position:relative;overflow:hidden}\n.duotone::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background:var(--color-accent);mix-blend-mode:color}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: meric:tabular-nums; }\n  ::-webkit-scrollbar { width:0; height:0; }\n  .leaflet-container { background:#f0eee7; font-family:'Heebo',sans-serif; }\n  .leaflet-control-attribution { font-size:8px; opacity:.5; }\n  @keyframes rise { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }\n  @keyframes sweep { from { opacity:.25; } to { opacity:1; } }\n<\u002Fstyle>\n\n<\u002Fhelmet>\n\n<div dir=\"rtl\" style=\"min-height:100vh;display:flex;justify-content:center;background:radial-gradient(120% 70% at 50% 0%, #f4f7fb 0%, #f6f2e9 45%, #efe9dd 100%);\">\n<div style=\"width:100%;max-width:480px;min-height:100vh;background:linear-gradient(#fffefb, #fdfbf5 50%, #faf7ef);box-shadow:0 0 60px rgba(74,52,30,.12);display:flex;flex-direction:column;position:relative;\">\n\n  <header style=\"position:sticky;top:0;z-index:60;background:rgba(255,254,251,.9);backdrop-filter:blur(12px);border-bottom:1px solid rgba(74,52,30,.08);padding:12px 16px 10px;display:flex;align-items:center;gap:10px;\">\n    <div style=\"width:32px;height:32px;flex:none;display:grid;place-items:center;border-radius:11px;background:linear-gradient(140deg,#2f6fb5,#4fa3cf);color:#fff;font-size:16px;font-weight:700;box-shadow:0 4px 12px rgba(47,111,181,.32);\">旅<\u002Fdiv>\n    <div style=\"flex:1;min-width:0;\">\n      <div class=\"lat\" style=\"font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--color-accent-700);\">Shechtman family · dossier<\u002Fdiv>\n      <div style=\"font-size:13px;font-weight:700;letter-spacing:-0.01em;\">אוזבקיסטן · יפן · קוריאה<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"lat\" style=\"text-align:left;line-height:1.1;\">\n      <div style=\"font-size:19px;font-weight:700;color:var(--color-accent-800);\">{{ daysToGo }}<\u002Fdiv>\n      <div style=\"font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(45,35,26,.68);\">days out<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <main style=\"flex:1;padding:16px 16px 96px;display:flex;flex-direction:column;gap:16px;\">\n\n    <sc-if value=\"{{ isToday }}\" hint-placeholder-val=\"{{ true }}\">\n      <section style=\"padding:26px 20px 24px;border-radius:20px;background:linear-gradient(145deg, #2f6fb5 0%, #3a86c9 48%, #4fa3cf 100%);box-shadow:0 2px 4px rgba(74,52,30,.08), 0 18px 40px rgba(47,111,181,.26);color:#ffffff;animation:rise .5s cubic-bezier(.16,1,.3,1) both;\">\n                <div class=\"lat\" style=\"font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.82);\">Itinerary 07.09 — 05.10 · {{ tripLen }} days<\u002Fdiv>\n        <h1 style=\"font-size:34px;line-height:1.05;margin:9px 0 4px;color:#fff;\">חמש ערים,<br>שלוש תרבויות,<br>מסלול אחד.<\u002Fh1>\n        <p style=\"font-size:12.5px;line-height:1.6;color:rgba(255,255,255,.86);margin:9px 0 2px;max-width:34ch;text-wrap:pretty;\">מהשווקים של טשקנט, דרך המקדשים והנאונים של יפן, ועד הסמטאות של סיאול — הכול במקום אחד, מסונכרן לכל המשפחה.<\u002Fp>\n      <\u002Fsection>\n\n      <section class=\"card\" style=\"background:#fffefb;border:0;border-radius:16px;box-shadow:0 1px 2px rgba(74,52,30,.05), 0 10px 26px rgba(74,52,30,.07);padding:14px;\">\n                <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:8px;\">\n          <div class=\"card-kicker lat\" style=\"letter-spacing:.16em;\">Next leg<\u002Fdiv>\n          <div class=\"lat\" style=\"font-size:10.5px;color:rgba(45,35,26,.68);\">{{ nextLegCountdown }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:12px;margin-top:2px;\">\n          <div class=\"lat\" style=\"font-size:27px;font-weight:700;line-height:1;\">{{ nextLegFrom }}<\u002Fdiv>\n          <div style=\"flex:1;height:1px;background:rgba(74,52,30,.1);position:relative;\">\n            <div style=\"position:absolute;inset-inline-start:0;top:-4px;width:7px;height:7px;background:var(--color-accent);\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div cla :4px 13px 12px;\">\n                <sc-for list=\"{{ expenseRows }}\" as=\"e\" hint-placeholder-count=\"4\">\n          <div style=\"display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid rgba(74,52,30,.08);\">\n            <div style=\"flex:1;min-width:0;\">\n              <div style=\"font-size:12.5px;\">{{ e.person }} · {{ e.category }}<\u002Fdiv>\n              <div class=\"lat\" style=\"font-size:10px;color:rgba(45,35,26,.68);\">{{ e.date }} {{ e.note }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"lat\" dir=\"ltr\" style=\"font-size:13.5px;font-weight:600;\">₪{{ e.amountStr }}<\u002Fdiv>\n            <button type=\"button\" sc-camel-on-click=\"{{ e.remove }}\" style=\"background:none;border:0;cursor:pointer;color:rgba(45,35,26,.6);font-size:14px;padding:0 2px;\">×<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <div style=\"font-size:11px;color:rgba(45,35,26,.68);padding-top:9px;\">{{ expenseSummary }}<\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isInfo }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;gap:5px;overflow-x:auto;\">\n        <sc-for list=\"{{ infoTabs }}\" as=\"t\" hint-placeholder-count=\"5\">\n          <button type=\"button\" class=\"btn {{ t.cls }}\" style=\"flex:none;font-size:12px;\" sc-camel-on-click=\"{{ t.pick }}\">{{ t.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ isTransport }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex;flex-direction:column;gap:14px;\">\n          <sc-for list=\"{{ transport }}\" as=\"g\" hint-placeholder-count=\"4\">\n            <div>\n              <div class=\"lat\" style=\"font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--color-accent-700);margin-bottom:7px;\">{{ g.region }}<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:9px;\">\n                <sc-for list=\"{ =\"{{ false }}\">\n        <div style=\"display:flex;flex-direction:column;gap:10px;\">\n          <div class=\"card\" style=\"background:#fffefb;border:0;border-radius:16px;box-shadow:0 1px 2px rgba(74,52,30,.05), 0 10px 26px rgba(74,52,30,.07);padding:12px 13px;background:rgba(226,87,76,.09);\">\n                        <div style=\"font-size:12px;line-height:1.6;\">קודי ה-QR של Visit Japan Web הם אישיים למעבר גבול — לא לשתף מחוץ למשפחה.<\u002Fdiv>\n            <a href=\"https://services.digital.go.jp/en/visit-japan-web/\" target=\"_blank\" rel=\"noreferrer\" class=\"btn btn-primary lat\" style=\"font-size:11.5px;\">פתיחת Visit Japan Web<\u002Fa>\n          <\u002Fdiv>\n          <sc-for list=\"{{ visas }}\" as=\"v\" hint-placeholder-count=\"3\">\n            <div class=\"card\" style=\"background:#fffefb;border:0;border-radius:16px;box-shadow:0 1px 2px rgba(74,52,30,.05), 0 10px 26px rgba(74,52,30,.07);padding:11px;\">\n                            <div class=\"lat\" style=\"font-size:12px;font-weight:600;letter-spacing:.04em;\">{{ v.name }}<\u002Fdiv>\n              <a href=\"{{ v.file }}\" target=\"_blank\" rel=\"noreferrer\" style=\"display:block;\">{{ v.img }}<\u002Fa>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isEmergency }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;flex-direction:column;gap:9px;\">\n          <sc-for list=\"{{ emergency }}\" as=\"e\" hint-placeholder-count=\"3\">\n            <div class=\"card\" style=\"background:#fffefb;border:0;border-radius:16px;box-shadow:0 1px 2px rgba(74,52,30,.05), 0 10px 26px rgba(74,52,30,.07);padding:12px 13px;\">\n                            <div style=\"font-size:14px;font-weight:700;\">{{ e.country }}<\u002Fdiv>\n              <div style=\"display:flex;gap:8px;\">\n                <a href=\"{{ e.policeTel }}\" class=\"btn btn-secondary lat\" style=\"flex:1;font-size:12px;\">משטרה {{ e.police }}<\u002Fa>\n                <a href=\"{{ e.medTel }}\" class=\"btn btn-secondary lat\" style=\"flex:1;font-size:12px;\">אמבולנס {{ e.medical }}<\u002Fa>\n              <\u002Fdiv>\n              <div class=\"lat\" style=\"font-size:11px;line-height:1.6;color:rgba(45,35,26,.6);\">{{ e.embassy }}<\u002Fdiv>\n              <div class=\"lat\" style=\"font-size:11px;color:var(--color-accent-700);\">{{ e.phoneLine }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fsc-if>\n\n  <\u002Fmain>\n\n  <nav style=\"position:sticky;bottom:0;z-index:60;background:rgba(255,254,251,.94);backdrop-filter:blur(12px);border-top:1px solid rgba(74,52,30,.08);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:2px;\">\n    <sc-for list=\"{{ tabs }}\" as=\"t\" hint-placeholder-count=\"5\">\n      <button type=\"button\" sc-camel-on-click=\"{{ t.pick }}\" style=\"background:{{ t.bg }};border:0;border-radius:14px;padding:9px 2px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;color:{{ t.color }};transition:background .2s,color .2s;\">\n        <span class=\"lat\" style=\"font-size:10.5px;letter-spacing:.12em;opacity:.7;\">{{ t.code }}<\u002Fspan>\n        <span style=\"font-size:11.5px;font-weight:600;\">{{ t.label }}<\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fnav>\n\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;tripYear&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:2026,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:2025,&quot;max&quot;:2030,&quot;section&quot;:&quot;טיול&quot;},&quot;startTab&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;today&quot;,&quot;options&quot;:[&quot;today&quot;,&quot;route&quot;,&quot;reco&quot;,&quot;budget&quot;,&quot;info&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;טיול&quot;}}\">\nconst CAT = {\n  culture:  { label: \"תרבות\",      color: \"#2f6fb5\" },\n  nature:   { label: \"טבע\",        color: \"#2f7d76\" },\n  food:     { label: \"אוכל\",       color: \"#c94f6d\" },\n  shopping: { label: \"קניות/לילה\", color: \"#6f5aa8\" }\n};\nconst RECO_CAT = {\n  culture:  \"אטרקציות\",\n  shopping: \"קניות\",\n  food:     \"מסעדות\",\n  bars:     \"ברים\",\n  cafes:    \"בתי קפה\"\n};\n/* one hue per kind of place, warm and saturated — the app's colour language */\nconst RECO_COLOR = {\n  culture:  \"#2f6fb5\",\n  shopping: \"#6f5aa8\",\n  food:     \"#c94f6d\",\n  bars:     \"#2f7d76\",\n  cafes:    \"#4fa3cf\"\n};\nconst CAT_COLOR = (k) => RECO_COLOR[k] || \"#2f6fb5\";\nconst CAT_TINT = (k) => ({\n  culture:  \"#e8f0f9\",\n  shopping: \"#efebf8\",\n  food:     \"#fbecf0\",\n  bars:     \"#e6f2f1\",\n  cafes:    \"#eaf5fb\"\n}[k] || \"#e8f0f9\");\nconst WX_CITIES = [\n  { heb: \"טשקנט\", lat: 41.3111, lon: 69.2797 },\n  { heb: \"טוקיו\", lat: 35.6895, lon: 139.6917 },\n  { heb: \"קיוטו\", lat: 35.0116, lon: 135.7681 },\n  { heb: \"אוסקה\", lat: 34.6937, lon: 135.5023 },\n  { heb: \"סיאול\", lat: 37.5665, lon: 126.978 }\n];\nconst PRE_FLIGHT = [\n  { id: \"pass\", label: \"דרכונים בתוקף 6 חודשים קדימה\", tag: \"DOCS\" },\n  { id: \"vjw\", label: \"Visit Japan Web — QR לכל אחד\", tag: \"DOCS\" },\n  { id: \"keta\", label: \"K-ETA / הצהרת בריאות לקוריאה\", tag: \"DOCS\" },\n  { id: \"ins\", label: \"ביטוח נסיעות כולל רפואי\", tag: \"DOCS\" },\n  { id: \"esim\", label: \"eSIM ליפן ולקוריאה\", tag: \"TECH\" },\n  { id: \"suica\", label: \"Suica בארנק באייפון + טעינה\", tag: \"TECH\" },\n  { id: \"tmoney\", label: \"T-money — לקנות בהגעה לסיאול\", tag: \"TECH\" },\n  { id: \"naver\", label: \"להוריד Naver Map / KakaoMap\", tag: \"TECH\" },\n  { id: \"smartex\", label: \"כרטיסי שינקנסן ב-SmartEX\", tag: \"TRAVEL\" },\n  { id: \"cash\", label: \"מזומן ין ווון להתחלה\", tag: \"MONEY\" },\n  { id: \"cards\", label: \"להודיע לבנק על נסיעה\", tag: \"MONEY\" },\n  { id: \"adapter\", label: \"מתאם חשמל A/B + פאוורבנק\", tag: \"PACK\" },\n  { id: \"meds\", label: \"תרופות במזוודת יד + מרשם\", tag: \"PACK\" },\n  { id: \"offline\", label: \"מפות אופליין ב-Google Maps\", tag: \"TECH\" }\n];\nconst WX_LABEL = (c) => {\n  if (c === 0) return \"בהיר\";\n  if (c === 1 || c === 2) return \"מעונן חלקית\";\n  if (c === 3) return \"מעונן\";\n  if (c === 45 || c === 48) return \"אובך\";\n  if (c >= 51 && c <= 57) return \"טפטוף\";\n  if (c >= 61 && c <= 67) return \"גשם\";\n  if (c >= 71 && c <= 77) return \"שלג\";\n  if (c >= 80 && c <= 82) return \"ממטרים\";\n  if (c >= 95) return \"סופות\";\n  return \"—\";\n};\nconst TABS = [\n  { id: \"today\",  code: \"01\", label: \"היום\" },\n  { id: \"route\",  code: \"02\", label: \"מסלול\" },\n  { id: \"reco\",   code: \"03\", label: \"המלצות\" },\n  { id: \"budget\", code: \"04\", label: \"תקציב\" },\n  { id: \"info\",   code: \"05\", label: \"מידע\" }\n];\nconst INFO_TABS = [\n  { id: \"apps\",      label: \"אפליקציות\" },\n  { id: \"transport\", label: \"תחבורה\" },\n  { id: \"phrases\",   label: \"שפה\" },\n  { id: \"hotels\",    label: \"מלונות\" },\n  { id: \"visa\",      label: \"ויזה\" },\n  { id: \"emergency\", label: \"חירום\" }\n];\nconst nf = (n) => Math.round(n).toLocaleString(\"he-IL\");\n\nclass Component extends DCLogic {\n  state = {\n    loaded: false, tab: \"today\", infoTab: \"transport\",\n    city: \"all\", openKey: null,\n    recoCity: null, recoCat: \"all\", recoQ: \"\",\n    phLang: \"ja\", phGroup: \"all\", phQ: \"\",\n    expenses: [], checks: {}, wish: {}, notes: {}, budget: null,\n    fx: null, fxStatus: \"טוען…\", ils: 100, wx: [],\n    formOpen: false, fPerson: \"רוני\", fCat: \"קניות\", fNote: \"\", fAmount: \"\"\n  };\n\n  componentDidMount() {\n    if (this.props.startTab) this.setState({ tab: this.props.startTab });\n    import(\"./trip-data.js\").then((m) => {\n      this.data = m;\n      this.setState({ loaded: true, recoCity: Object.keys(m.RECO)[0] });\n      this.loadWx();\n    });\n    this.loadFx();\n    this.attachSync();\n    this.clock = setInterval(() => this.forceUpdate(), 60000);\n  }\n\n  componentWillUnmount() {\n    clearInterval(this.clock);\n    (this.unsubs || []).forEach((f) => { try { f && f(); } catch (e) {} });\n    if (this.map) { try { this.map.remove(); } catch (e) {} this.map = null; }\n  }\n\n  attachSync() {\n    const go = () => {\n      const S = window.TripSync;\n      if (!S) { setTimeout(go, 250); return; }\n      this.sync = S;\n      this.unsubs = [\n        S.listenExpenses((rows) => this.setState({ expenses: rows })),\n        S.listenDoc(\"checklist\", (v) => this.setState({ checks: v || {} })),\n        S.listenDoc(\"wish\", (v) => this.setState({ wish: v || {} })),\n        S.listenDoc(\"dayNotes\", (v) => this.setState({ notes: v || {} }))\n      ];\n    };\n    go();\n  }\n\n  async loadFx() {\n    const urls = [\n      \"https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/ils.min.json\",\n      \"https://latest.currency-api.pages.dev/v1/currencies/ils.min.json\"\n    ];\n    for (const u of urls) {\n      try {\n        const r = await fetch(u, { cache: \"no-store\" });\n        if (!r.ok) continue;\n        const d = await r.json();\n        if (d && d.ils && d.ils.jpy) {\n          this.setState({ fx: { jpy: d.ils.jpy, krw: d.ils.krw }, fxStatus: \"עודכן \" + (d.date || \"\") });\n          return;\n        }\n      } catch (e) { /* try next */ }\n    }\n    this.setState({ fxStatus: \"שערים לא זמינים\" });\n  }\n\n  async loadWx() {\n    try {\n      const lats = WX_CITIES.map((c) => c.lat).join(\",\");\n      const lons = WX_CITIES.map((c) => c.lon).join(\",\");\n      const r = await fetch(\"https://api.open-meteo.com/v1/forecast?latitude=\" + lats + \"&longitude=\" + lons + \"&current_weather=true&timezone=auto\", { cache: \"no-store\" });\n      const d = await r.json();\n      const arr = Array.isArray(d) ? d : [d];\n      this.setState({\n        wx: WX_CITIES.map((c, i) => {\n          const cw = arr[i] && arr[i].current_weather;\n          return { heb: c.heb, temp: cw ? Math.round(cw.temperature) : \"–\", label: cw ? WX_LABEL(cw.weathercode) : \"—\" };\n        })\n      });\n    } catch (e) {\n      this.setState({ wx: WX_CITIES.map((c) => ({ heb: c.heb, temp: \"–\", label: \"לא זמין\" })) });\n    }\n  }\n\n  year() { return this.props.tripYear ?? 2026; }\n\n  dateOf(dmy) {\n    const p = String(dmy).split(\".\");\n    return new Date(this.year(), Number(p[1]) - 1, Number(p[0]));\n  }\n\n  allDays() {\n    if (!this.data) return [];\n    const out = [];\n    this.data.TRIP.forEach((c) => c.days.forEach((d) => out.push({ ...d, city: c.city, code: c.code })));\n    return out.sort((a, b) => this.dateOf(a.date) - this.dateOf(b.date));\n  }\n\n  /* ——— shared writes ——— */\n  toggleCheck(id) {\n    const next = { ...this.state.checks, [id]: !this.state.checks[id] };\n    this.setState({ checks: next });\n    if (this.sync) this.sync.setDoc(\"checklist\", next);\n  }\n  toggleWish(key) {\n    const next = { ...this.state.wish };\n    if (next[key]) delete next[key]; else next[key] = true;\n    this.setState({ wish: next });\n    if (this.sync) this.sync.setDoc(\"wish\", next);\n  }\n  setNote(key, text) {\n    const next = { ...this.state.notes, [key]: text };\n    this.setState({ notes: next });\n    if (this.sync) this.sync.setDoc(\"dayNotes\", next);\n  }\n\n  submitExpense() {\n    const amount = parseFloat(this.state.fAmount);\n    if (!amount || amount <= 0) return;\n    const entry = {\n      id: Date.now(),\n      date: new Date().toLocaleDateString(\"he-IL\"),\n      person: this.state.fPerson,\n      category: this.state.fCat,\n      note: this.state.fNote.trim(),\n      amount\n    };\n    if (navigator.vibrate) { try { navigator.vibrate(12); } catch (e) {} }\n    this.setState({ fAmount: \"\", fNote: \"\" });\n    if (this.sync) this.sync.saveExpense(entry);\n  }\n\n  /* \"על הדרך\" — cluster a city's picks by neighborhood keyword, and keep only areas\n     worth a dedicated outing: 2+ places from 2+ different categories. */\n  nearby(cityData) {\n    const D = this.data;\n    if (!D || !cityData) return [];\n    const keys = D.NEIGHBORHOODS[this.state.recoCity] || [];\n    const q = this.state.recoQ.trim().toLowerCase();\n    const clusters = {};\n    keys.forEach((k) => { clusters[k] = []; });\n    Object.keys(RECO_CAT).forEach((cat) => {\n      (cityData[cat] || []).forEach((name) => {\n        if (q && name.toLowerCase().indexOf(q) === -1) return;\n        const forced = D.AREA_OVERRIDES[name];\n        if (forced) { if (clusters[forced]) clusters[forced].push({ name, cat }); return; }\n        const lower = name.toLowerCase();\n        const hit = keys.find((k) => lower.indexOf(k.toLowerCase()) !== -1);\n        if (hit) clusters[hit].push({ name, cat });\n      });\n    });\n    return Object.keys(clusters)\n      .map((area) => ({ area, items: clusters[area] }))\n      .filter((g) => g.items.length >= 2 && new Set(g.items.map((i) => i.cat)).size >= 2)\n      .sort((a, b) => b.items.length - a.items.length);\n  }\n\n  speak(text, lang) {\n    try {\n      window.speechSynthesis.cancel();\n      const u = new SpeechSynthesisUtterance(text);\n      u.lang = lang;\n      u.rate = 0.85;\n      window.speechSynthesis.speak(u);\n    } catch (e) {}\n  }\n\n  /* ——— map ——— */\n  mountMap(el) {\n    if (!el) {\n      if (this.map) { try { this.map.remove(); } catch (e) {} this.map = null; }\n      return;\n    }\n    if (this.map || !window.L) return;\n    const map = window.L.map(el, { zoomControl: false, attributionControl: true }).setView([36, 128], 4);\n    window.L.control.zoom({ position: \"topleft\" }).addTo(map);\n    window.L.tileLayer(\"https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png\", {\n      attribution: \"© OpenStreetMap · CARTO\", subdomains: \"abcd\", maxZoom: 19\n    }).addTo(map);\n    window.L.tileLayer(\"https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png\", {\n      subdomains: \"abcd\", maxZoom: 19, opacity: 0.9\n    }).addTo(map);\n    this.map = map;\n    this.markers = [];\n    this.allDays().forEach((d) => d.places.forEach((p) => {\n      const color = (CAT[p.cat] || CAT.culture).color;\n      const mk = window.L.marker([p.lat, p.lng], {\n        icon: window.L.divIcon({\n          className: \"\",\n          html: '<div style=\"width:11px;height:11px;background:' + color + ';border:1.5px solid #f2f2f3;box-shadow:0 0 0 1px rgba(29,31,32,.35)\"><\u002Fdiv>',\n          iconSize: [11, 11], iconAnchor: [5.5, 5.5]\n        })\n      }).addTo(map);\n      mk.bindPopup('<div style=\"font:600 12px Heebo,sans-serif\">' + p.n + '<\u002Fdiv><div style=\"font:11px Heebo,sans-serif;color:#5d5d60;max-width:200px\">' + (p.note || \"\") + \"<\u002Fdiv>\");\n      mk._city = d.city;\n      this.markers.push(mk);\n    }));\n    setTimeout(() => { map.invalidateSize(); this.fitCity(); }, 60);\n  }\n\n  fitCity(cityName) {\n    if (!this.map || !this.markers) return;\n    const city = cityName || this.state.city;\n    const pts = this.markers.filter((m) => city === \"all\" || m._city === city).map((m) => m.getLatLng());\n    if (!pts.length) return;\n    this.map.fitBounds(window.L.latLngBounds(pts), { padding: [34, 34], maxZoom: 13 });\n  }\n\n  focusPlace(p) {\n    if (!this.map) return;\n    this.map.setView([p.lat, p.lng], 15, { animate: true });\n    const mk = (this.markers || []).find((m) => m.getLatLng().lat === p.lat && m.getLatLng().lng === p.lng);\n    if (mk) mk.openPopup();\n    if (this.mapEl && this.mapEl.getBoundingClientRect().top < 0) window.scrollTo({ top: 0, behavior: \"smooth\" });\n  }\n\n  renderVals() {\n    const st = this.state;\n    const D = this.data;\n    const today = new Date();\n    const start = new Date(this.year(), 8, 7);\n    const end = new Date(this.year(), 9, 5);\n    const daysToGo = Math.max(0, Math.ceil((start - today) / 86400000));\n    const tripLen = Math.round((end - start) / 86400000) + 1;\n\n    /* ——— today ——— */\n    const flights = D ? D.FLIGHTS : [];\n    const nextLeg = flights.find((f) => this.dateOf(f.date) >= today) || flights[0] || {};\n    const legDays = nextLeg.date ? Math.max(0, Math.ceil((this.dateOf(nextLeg.date) - today) / 86400000)) : 0;\n    const fx = st.fx;\n    const ilsNum = parseFloat(st.ils) || 0;\n\n    const checkTotal = PRE_FLIGHT.length;\n    const checkDone = PRE_FLIGHT.filter((c) => st.checks[c.id]).length;\n\n    /* ——— route ——— */\n    const days = this.allDays()\n      .filter((d) => st.city === \"all\" || d.city === st.city)\n      .map((d) => {\n        const key = d.city + \"::\" + d.date;\n        const dt = this.dateOf(d.date);\n        return {\n          key, code: d.code, title: d.title || \"יום חופשי\",\n          dayNum: d.date.split(\".\")[0],\n          monthShort: Number(d.date.split(\".\")[1]) === 9 ? \"SEP\" : \"OCT\",\n          weekday: dt.toLocaleDateString(\"he-IL\", { weekday: \"long\" }),\n          count: d.places.length ? d.places.length + \" עצירות\" : \"פנוי\",\n          open: st.openKey === key,\n          headBg: st.openKey === key ? \"linear-gradient(#eef4fb,#f8fafd)\" : \"transparent\",\n          note: st.notes[key] || \"\",\n          onNote: (e) => this.setNote(key, e.target.value),\n          toggle: () => this.setState({ openKey: st.openKey === key ? null : key }),\n          places: d.places.map((p) => ({\n            n: p.n, note: p.note, link: p.link,\n            color: (CAT[p.cat] || CAT.culture).color,\n            focus: () => this.focusPlace(p)\n          }))\n        };\n      });\n\n    const cityChips = [{ city: \"all\", label: \"כל המסלול\" }]\n      .concat((D ? D.TRIP : []).map((c) => ({ city: c.city, label: c.city + \" \" + c.code })))\n      .map((c) => ({\n        label: c.label,\n        cls: st.city === c.city ? \"btn-primary\" : \"btn-secondary\",\n        pick: () => { this.setState({ city: c.city, openKey: null }); setTimeout(() => this.fitCity(c.city), 30); }\n      }));\n\n    /* ——— recommendations ——— */\n    const recoCityData = (D && st.recoCity) ? D.RECO[st.recoCity] : null;\n    const recoCities = (D ? Object.keys(D.RECO) : []).map((c) => ({\n      label: c,\n      cls: st.recoCity === c ? \"btn-primary\" : \"btn-secondary\",\n      pick: () => this.setState({ recoCity: c })\n    }));\n    const catKeys = Object.keys(RECO_CAT);\n    const recoCats = [{ k: \"all\", label: \"הכל\" }]\n      .concat(catKeys.map((k) => ({ k, label: RECO_CAT[k] })))\n      .concat([{ k: \"nearby\", label: \"על הדרך\" }, { k: \"wish\", label: \"★ רשימת רצון\" }])\n      .map((c) => {\n        let count = \"\";\n        if (recoCityData) {\n          if (c.k === \"all\") count = catKeys.reduce((s, k) => s + (recoCityData[k] || []).length, 0);\n          else if (c.k === \"nearby\") count = this.nearby(recoCityData).length;\n          else if (c.k === \"wish\") count = Object.keys(st.wish).length;\n          else count = (recoCityData[c.k] || []).length;\n        }\n        return {\n          label: c.label, count: count,\n          cls: st.recoCat === c.k ? \"tag-accent\" : \"tag-neutral\",\n          pick: () => this.setState({ recoCat: c.k })\n        };\n      });\n\n    let recoList = [];\n    if (recoCityData) {\n      const q = st.recoQ.trim().toLowerCase();\n      catKeys.forEach((k) => {\n        if (st.recoCat !== \"all\" && st.recoCat !== \"wish\" && st.recoCat !== k) return;\n        (recoCityData[k] || []).forEach((name) => {\n          const key = st.recoCity + \"::\" + name;\n          if (st.recoCat === \"wish\" && !st.wish[key]) return;\n          if (q && name.toLowerCase().indexOf(q) === -1) return;\n          recoList.push({\n            name, catLabel: RECO_CAT[k], color: CAT_COLOR(k), tint: CAT_TINT(k),\n            link: \"https://www.google.com/maps/search/?api=1&query=\" + encodeURIComponent(name + \" \" + st.recoCity),\n            starMark: st.wish[key] ? \"★\" : \"☆\",\n            starColor: st.wish[key] ? \"var(--color-accent)\" : \"rgba(45,35,26,.4)\",\n            star: () => this.toggleWish(key)\n          });\n        });\n      });\n    }\n    const recoShown = recoList.slice(0, 140);\n\n    /* ——— budget ——— */\n    const exp = st.expenses;\n    const total = exp.reduce((s, e) => s + (Number(e.amount) || 0), 0);\n\n    const sumBy = (field) => {\n      const m = {};\n      exp.forEach((e) => { const k = e[field] || \"אחר\"; m[k] = (m[k] || 0) + (Number(e.amount) || 0); });\n      return Object.keys(m).map((k) => ({ name: k, amount: m[k] })).sort((a, b) => b.amount - a.amount);\n    };\n    const maxOf = (rows) => rows.reduce((s, r) => Math.max(s, r.amount), 0) || 1;\n    const personRows = sumBy(\"person\");\n    const catRows = sumBy(\"category\");\n    const catPalette = [\"#2f6fb5\", \"#4fa3cf\", \"#6f5aa8\", \"#2f7d76\", \"#c94f6d\", \"#8fbde0\"];\n\n    const byDay = {};\n    exp.forEach((e) => { byDay[e.date] = (byDay[e.date] || 0) + (Number(e.amount) || 0); });\n    const dayKeys = Object.keys(byDay);\n    const maxDay = dayKeys.reduce((s, k) => Math.max(s, byDay[k]), 0) || 1;\n    const burnPoints = dayKeys.length\n      ? dayKeys.map((k, i) => {\n          const x = dayKeys.length === 1 ? 150 : (i / (dayKeys.length - 1)) * 300;\n          return Math.round(x) + \",\" + Math.round(66 - (byDay[k] / maxDay) * 60);\n        }).join(\" \")\n      : \"0,68 300,68\";\n\n    /* ——— phrases ——— */\n    const phraseSrc = D ? D.PHRASES : [];\n    const phraseGroups = [{ k: \"all\", label: \"הכל\" }]\n      .concat(phraseSrc.map((g) => ({ k: g.group, label: g.group })))\n      .map((g) => ({\n        label: g.label,\n        cls: st.phGroup === g.k ? \"tag-accent\" : \"tag-neutral\",\n        pick: () => this.setState({ phGroup: g.k })\n      }));\n    const ja = st.phLang === \"ja\";\n    const pq = st.phQ.trim().toLowerCase();\n    const phrases = [];\n    phraseSrc.forEach((g) => {\n      if (st.phGroup !== \"all\" && st.phGroup !== g.group) return;\n      g.items.forEach((it) => {\n        const native = ja ? it.ja : it.ko;\n        const roman = ja ? it.jaR : it.koR;\n        if (pq && (it.he + \" \" + roman).toLowerCase().indexOf(pq) === -1) return;\n        phrases.push({\n          he: it.he, native, roman,\n          lang: ja ? \"ja\" : \"ko\",\n          speak: () => this.speak(native, ja ? \"ja-JP\" : \"ko-KR\")\n        });\n      });\n    });\n\n    return {\n      /* nav */\n      tabs: TABS.map((t) => ({\n        code: t.code, label: t.label,\n        bg: st.tab === t.id ? \"linear-gradient(140deg,#2f6fb5,#3f92c9)\" : \"transparent\",\n        color: st.tab === t.id ? \"#ffffff\" : \"rgba(45,35,26,.55)\",\n        pick: () => { this.setState({ tab: t.id }); window.scrollTo({ top: 0 }); }\n      })),\n      isToday: st.tab === \"today\", isRoute: st.tab === \"route\", isReco: st.tab === \"reco\",\n      isBudget: st.tab === \"budget\", isInfo: st.tab === \"info\",\n      infoTabs: INFO_TABS.map((t) => ({\n        label: t.label,\n        cls: st.infoTab === t.id ? \"btn-primary\" : \"btn-secondary\",\n        pick: () => this.setState({ infoTab: t.id })\n      })),\n      isApps: st.infoTab === \"apps\",\n      apps: (D ? D.APPS : []).filter((a) => a.url).map((a) => ({\n        name: a.name, note: a.note, url: a.url,\n        stores: [{ label: \"App Store\", url: a.ios }, { label: \"Play\", url: a.android }].filter((s) => s.url)\n      })),\n      isTransport: st.infoTab === \"transport\", isPhrases: st.infoTab === \"phrases\",\n      isHotels: st.infoTab === \"hotels\", isVisa: st.infoTab === \"visa\", isEmergency: st.infoTab === \"emergency\",\n\n      /* today */\n      daysToGo, tripLen,\n      placeCount: this.allDays().reduce((s, d) => s + d.places.length, 0),\n      nextLegFrom: nextLeg.from || \"TLV\", nextLegTo: nextLeg.to || \"TAS\", nextLegNo: nextLeg.no || \"—\",\n      nextLegDate: nextLeg.date || \"07.09\", nextLegDep: nextLeg.dep || \"—\",\n      nextLegNote: nextLeg.note || \"טוען פרטי טיסה…\",\n      nextLegCountdown: nextLeg.date ? (legDays > 0 ? \"בעוד \" + legDays + \" ימים\" : \"היום\") : \"—\",\n      wx: st.wx, onRefreshWx: () => this.loadWx(),\n      fxStatus: st.fxStatus, ils: st.ils,\n      jpy: fx ? nf(ilsNum * fx.jpy) : \"—\",\n      krw: fx ? nf(ilsNum * fx.krw) : \"—\",\n      onIls: (e) => this.setState({ ils: e.target.value }),\n      checkTotal, checkDone, checkPct: Math.round((checkDone / checkTotal) * 100),\n      checklist: PRE_FLIGHT.map((c) => {\n        const on = !!st.checks[c.id];\n        return {\n          label: c.label, tag: c.tag, mark: on ? \"✓\" : \"\",\n          border: on ? \"var(--color-accent)\" : \"rgba(45,35,26,.4)\",\n          fill: on ? \"var(--color-accent)\" : \"transparent\",\n          color: on ? \"rgba(45,35,26,.6)\" : \"#2d231a\",\n          strike: on ? \"line-through\" : \"none\",\n          toggle: () => this.toggleCheck(c.id)\n        };\n      }),\n\n      /* route */\n      cityChips, days,\n      mapRef: (el) => { this.mapEl = el; this.mountMap(el); },\n      legend: Object.keys(CAT).map((k) => ({ label: CAT[k].label, color: CAT[k].color })),\n\n      /* reco */\n      recoCities, recoCats, recoQ: st.recoQ,\n      onRecoQ: (e) => this.setState({ recoQ: e.target.value }),\n      isNearby: st.recoCat === \"nearby\",\n      isFlatList: st.recoCat !== \"nearby\",\n      nearbyGroups: (st.recoCat === \"nearby\" ? this.nearby(recoCityData) : []).map((g) => ({\n        area: g.area, count: g.items.length,\n        color: CAT_COLOR(g.items[0].cat),\n        items: g.items.map((i) => ({\n          name: i.name, color: CAT_COLOR(i.cat), tint: CAT_TINT(i.cat),\n          link: \"https://www.google.com/maps/search/?api=1&query=\" + encodeURIComponent(i.name + \" \" + st.recoCity)\n        }))\n      })),\n      nearbySummary: (st.recoCat === \"nearby\" && recoCityData && this.nearby(recoCityData).length === 0)\n        ? \"לא נמצאו אזורים עם כמה מקומות מסוגים שונים — נסו עיר אחרת או נקו את החיפוש.\"\n        : \"רק אזורים עם 2 מקומות ומעלה משני סוגים שונים מופיעים כאן.\",\n      recoList: recoShown,\n      recoSummary: recoList.length\n        ? recoList.length + \" מקומות\" + (recoList.length > recoShown.length ? \" · מוצגים 140 הראשונים\" : \"\") + \" · ★ נשמר לכל המשפחה\"\n        : \"אין תוצאות — נסו חיפוש אחר\",\n\n      /* budget */\n      noExpenses: exp.length === 0,\n      totalStr: nf(total), entryCount: exp.length,\n      totalJpy: fx ? nf(total * fx.jpy) : \"—\",\n      totalKrw: fx ? nf(total * fx.krw) : \"—\",\n      byPerson: personRows.map((r) => ({ name: r.name, amountStr: nf(r.amount), pct: Math.round((r.amount / maxOf(personRows)) * 100) })),\n      byCat: catRows.map((r, i) => ({ name: r.name, amountStr: nf(r.amount), pct: Math.round((r.amount / maxOf(catRows)) * 100), color: catPalette[i % catPalette.length] })),\n      avgDayStr: nf(dayKeys.length ? total / dayKeys.length : 0),\n      burnPoints,\n      formOpen: st.formOpen,\n      formLabel: st.formOpen ? \"סגירה\" : \"+ הוספת הוצאה\",\n      toggleForm: () => this.setState({ formOpen: !st.formOpen }),\n      people: D ? D.PEOPLE : [], categories: D ? D.CATEGORIES : [],\n      fPerson: st.fPerson, fCat: st.fCat, fNote: st.fNote, fAmount: st.fAmount,\n      onFPerson: (e) => this.setState({ fPerson: e.target.value }),\n      onFCat: (e) => this.setState({ fCat: e.target.value }),\n      onFNote: (e) => this.setState({ fNote: e.target.value }),\n      onFAmount: (e) => this.setState({ fAmount: e.target.value }),\n      submitExpense: () => this.submitExpense(),\n      expenseRows: exp.slice().reverse().map((e) => ({\n        person: e.person, category: e.category, date: e.date,\n        note: e.note ? \"· \" + e.note : \"\",\n        amountStr: nf(e.amount),\n        remove: () => this.sync && this.sync.deleteExpense(e.id)\n      })),\n      expenseSummary: exp.length ? exp.length + \" רשומות · מסונכרן לכל המשפחה\" : \"עדיין אין הוצאות — מה שתוסיפו יופיע אצל כולם\",\n\n      /* info */\n      transport: D ? D.TRANSPORT : [],\n      jaCls: ja ? \"btn-primary\" : \"btn-secondary\",\n      koCls: ja ? \"btn-secondary\" : \"btn-primary\",\n      pickJa: () => this.setState({ phLang: \"ja\" }),\n      pickKo: () => this.setState({ phLang: \"ko\" }),\n      phQ: st.phQ, onPhQ: (e) => this.setState({ phQ: e.target.value }),\n      phraseGroups, phrases,\n      hotels: (D ? D.HOTELS : []).map((h) => ({\n        ...h, link: \"https://www.google.com/maps/search/?api=1&query=\" + encodeURIComponent(h.address)\n      })),\n      visas: (D ? D.VISA_PASSES : []).map((v) => ({\n        name: v.name, file: v.file,\n        img: React.createElement(\"img\", {\n          src: v.file, alt: \"Visit Japan Web\",\n          style: { width: \"100%\", border: \"1px solid rgba(74,52,30,.1)\" }\n        })\n      })),\n      emergency: (D ? D.EMERGENCY : []).map((e) => ({\n        country: e.country, police: e.police, medical: e.medical, embassy: e.embassy,\n        policeTel: \"tel:\" + e.police, medTel: \"tel:\" + e.medical,\n        phoneLine: e.phones.join(\" · \")\n      }))\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
